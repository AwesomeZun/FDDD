<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDDD Motion Showreel</title>
<meta name="description" content="FDDD: Fly-Driven Drug Development. Watch the 15-second and 30-second motion showreels in your browser.">
<style>
  :root { --bg: #04070b; --ink: #eaf2ef; --mute: #7f93a6; --line: #1d2b3d; --mint: #5ef2d0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "PretendardV", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #out { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
  body.render #out { width: 1920px; height: 1080px; }
  body.render #ui, body.render #loading { display: none !important; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px/1.6 "JBMono", ui-monospace, monospace;
    letter-spacing: .2em; color: var(--mute); pointer-events: none; }
  #ui { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(6, 12, 18, .78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity .35s; font: 500 13px "JBMono", ui-monospace, monospace; }
  #ui.idle { opacity: 0; }
  #ui button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  #ui button:hover { border-color: var(--mint); }
  #ui button.on { background: var(--mint); color: #04130f; border-color: var(--mint); }
  #ui .seg { display: flex; gap: 4px; }
  #ui input[type=range] { width: min(38vw, 420px); accent-color: var(--mint); }
  #ui .tc { min-width: 108px; text-align: right; color: var(--mute); }
  @media (max-width: 640px) { #ui { gap: 8px; padding: 8px; bottom: 10px; } #ui input[type=range] { width: 30vw; } #ui .tc { display: none; } }
  /*__FONTFACE__*/
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
<div id="loading">LOADING · Unpacking data</div>
<div id="ui" role="toolbar" aria-label="Playback controls">
  <button id="play" aria-label="Play">▶ Play</button>
  <div class="seg"><button id="cut15">15s</button><button id="cut30" class="on">30s</button></div>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Playback position">
  <span class="tc" id="tc">00:00.00</span>
</div>
<!--__DATA__-->
<script>
/*__EDL__*/
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
