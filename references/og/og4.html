<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap');
html,body{margin:0;width:1200px;height:630px;overflow:hidden;position:relative;background:#070e13;font-family:'DM Sans',sans-serif;color:#dce8f4}
.grid{position:absolute;inset:0;background-image:linear-gradient(#17303a55 1px,transparent 1px),linear-gradient(90deg,#17303a55 1px,transparent 1px);background-size:60px 60px;transform:perspective(900px) rotateX(58deg) translateY(120px) scale(2.2);transform-origin:50% 100%;opacity:.5}
.glow{position:absolute;right:-40px;top:-60px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,#1b5a5a55 0,#0b2a3022 45%,transparent 70%)}
.brain{position:absolute;right:120px;top:300px;width:520px;height:354px;background:url(og-brain.png) center/contain no-repeat;transform:rotate(-38deg) scaleX(-1);opacity:.95;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 60%,transparent 100%)}
.fly{position:absolute;right:-30px;top:40px;width:720px;height:438px;background:url(og-fly-crop.png) center/contain no-repeat;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 48% 46% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 48% 46% at 50% 50%,#000 55%,transparent 100%)}
.wrap{position:absolute;inset:0;padding:54px 72px 52px}
.mark{font-size:150px;line-height:.9;font-weight:700;letter-spacing:10px;margin:0 0 14px -6px;color:#eaf5f3}
.expand{font-size:30px;font-weight:500;letter-spacing:.2px;color:#8fb0b3;margin:0 0 30px}.expand b{color:#6fd3c6;font-weight:700}
.tag{font-size:22px;line-height:1.35;color:#c9dadd;margin:0;max-width:520px}
.stats{position:absolute;left:72px;bottom:52px;display:flex;gap:28px;font:12.5px 'IBM Plex Mono',monospace;color:#8fb0b3}.stats b{color:#e4f3f1;font-weight:500}.stats i{color:#3f5d63;font-style:normal}
.url{position:absolute;right:72px;bottom:52px;font:14px 'IBM Plex Mono',monospace;letter-spacing:2px;color:#6fd3c6}
.live{position:absolute;right:72px;top:54px;display:inline-flex;align-items:center;gap:8px;border:1px solid #2f6a5c;color:#8be6d3;font:12px 'IBM Plex Mono',monospace;letter-spacing:2px;padding:7px 12px;border-radius:3px;background:#0a1a1acc}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#6fd3c6;box-shadow:0 0 10px #6fd3c6}
.cap{position:absolute;right:72px;top:560px;font:9px 'IBM Plex Mono',monospace;letter-spacing:2px;color:#4f7a80}
</style></head><body><div class="grid"></div><div class="glow"></div><div class="brain"></div><div class="fly"></div><span class="live">LIVE · 20 BRAINS</span>
<div class="wrap"><div class="mark">FDDD</div><p class="expand"><b>F</b>ly-<b>D</b>riven <b>D</b>rug <b>D</b>evelopment</p><p class="tag">Fruit-fly brains computed live in your browser, learning a preference over real docking results.</p></div>
<div class="stats"><span><b>167,122</b> neurons / fly <i>· MaleCNS</i></span><span><b>6.2M</b> connections</span><span><b>8</b> executed Vina complexes</span></div><span class="url">flybrain.kr</span>
</body></html>
